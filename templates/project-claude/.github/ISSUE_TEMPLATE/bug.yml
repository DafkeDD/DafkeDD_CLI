name: Bug
description: Something in this project that does not work
labels: ['type:bug', 'status:ready']
body:
    - type: textarea
      id: what
      attributes:
          label: What happens
          description: The exact error message or behaviour (paste the output).
      validations:
          required: true
    - type: textarea
      id: expected
      attributes:
          label: What should happen
      validations:
          required: true
    - type: textarea
      id: steps
      attributes:
          label: How to reproduce
          description: The page or the endpoint, what you did, the command that failed.
      validations:
          required: true
    - type: input
      id: platform
      attributes:
          label: Platform
          description: Windows / macOS / Linux, Node.js and npm version
