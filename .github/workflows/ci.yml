name: CI

on:
    push:
        branches: [developer, main]
    pull_request:
        branches: [developer, main]

jobs:
    test:
        name: Tests (Node ${{ matrix.node }}, ${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                # Windows too: the CLI is used there (cmd.exe for npm/npx, CRLF checkouts, paths with backslashes)
                os: [ubuntu-latest, windows-latest]
                # The Node.js versions with support (20 ended in April 2026)
                node: [22, 24]
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - run: npm ci

            - name: Format check
              run: npm run format:check

            - name: Tests
              run: npm test

            # The CLI itself starts (also on Windows): its help and its version
            - name: The CLI starts
              run: |
                  node bin/cli.js --help
                  node bin/cli.js --version
