name: CI

on:
    push:
        branches: [developer, main]
    pull_request:
        branches: [developer, main]

# Only reading: no job pushes, comments or releases
permissions:
    contents: read

jobs:
    test:
        name: Tests (Node ${{ matrix.node }}, ${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                # Windows too: the CLI is used there (cmd.exe for npm/npx, CRLF checkouts, paths with backslashes)
                os: [ubuntu-latest, windows-latest]
                # The Node.js versions with support (20 ended in April 2026), and the newest (26)
                node: [22, 24, 26]
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - run: npm ci

            - name: Format check
              run: npm run format:check

            - name: Tests
              run: npm test

            # The CLI itself starts (also on Windows): its help and its version
            - name: The CLI starts
              run: |
                  node bin/cli.js --help
                  node bin/cli.js --version

    # The engine's own checks of the mods (mods/): claude plugin validate and claude plugin test, on a pinned Claude Code
    mods:
        name: Mods (claude plugin validate and test)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: npm

            - run: npm ci

            - name: Claude Code
              run: npm install --global @anthropic-ai/claude-code@2.1.316

            - name: Validate and test the mods
              run: node --test test/mods.test.js
              env:
                  REQUIRE_CLAUDE: '1'
