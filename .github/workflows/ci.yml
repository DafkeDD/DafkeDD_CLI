name: CI

on:
    push:
        branches: [developer, main]
    pull_request:
        branches: [developer, main]

jobs:
    test:
        name: Tests (Node ${{ matrix.node }}, ${{ matrix.os }})
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                node: [20, 22]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - run: npm ci

            - name: Format check
              run: npm run format:check

            - name: Tests
              run: npm test
